<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Web</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

body{
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at top left,
        rgba(255,255,255,0.30),
        transparent 35%),

        radial-gradient(circle at bottom right,
        rgba(255,255,255,0.25),
        transparent 40%),

        #07142b;

    background-size: 200% 200%;
    animation: bgGerak 8s ease infinite;

    color: white;
}

@keyframes bgGerak{
    0%{
        background-position: left top;
    }

    50%{
        background-position: right bottom;
    }

    100%{
        background-position: left top;
    }
}

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }

        .menu a {
            margin-left: 25px;
            text-decoration: none;
            color: #cbd5f5;
            transition: 0.3s;
        }

        .menu a:hover {
            color: #38bdf8;
        }

        /* HERO */
        .hero {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .hero p {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 25px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        /* CARD SECTION */
        .section {
            padding: 60px 40px;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            width: 250px;
            border-radius: 12px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            background: #334155;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 20px;
            background: #020617;
            color: #64748b;
        }

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* tombol open popup */
.open-popup-btn{
    padding:14px 30px;

    border:none;
    border-radius:16px;

    background:linear-gradient(
        135deg,
        #38bdf8,
        #2563eb
    );

    color:white;
    display:block;
     margin:40px auto;
    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 8px 20px rgba(37,99,235,0.35);
}

/* hover */
.open-popup-btn:hover{
    transform:translateY(-4px) scale(1.03);

    box-shadow:
    0 12px 28px rgba(37,99,235,0.45);
}

/* saat ditekan */
.open-popup-btn:active{
    transform:scale(0.96);
}

/* ========================= */
/* POPUP */
/* ========================= */

.popup{
    display:none;

    position:fixed;
    inset:0;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,0.6);

    backdrop-filter:blur(4px);

    z-index:999;
}

/* saat popup aktif */
.popup.show{
    display:flex;
}

/* ========================= */
/* BOX POPUP */
/* ========================= */

.popup-content{
    position:relative;

    width:70%;
    height:75%;

    background:#151515;

    border-radius:28px;

    padding:28px;

    overflow:auto;

    color:white;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.5);

    animation:popupAnim 0.3s ease;
}

/* animasi muncul */
@keyframes popupAnim{
    from{
        opacity:0;
        transform:scale(0.85) translateY(20px);
    }

    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

/* ========================= */
/* TOMBOL CLOSE */
/* ========================= */

.close-btn{
    position:absolute;

    top:14px;
    right:18px;

    background:none;
    border:none;

    color:white;

    font-size:34px;

    cursor:pointer;

    transition:0.25s;
}

/* hover X */
.close-btn:hover{
    transform:rotate(90deg);
    color:red;
}

/* ========================= */
/* TITLE */
/* ========================= */

.popup-content h1{
    font-size:30px;

    margin-bottom:20px;
}

/* ========================= */
/* MAIN BUTTON */
/* ========================= */

.main-btn{
    display:inline-block;

    padding:14px 24px;

    border:2px solid white;
    border-radius:16px;

    color:white;
    text-decoration:none;

    font-size:20px;
    font-weight:bold;

    transition:0.3s;

    margin-bottom:20px;
}

.main-btn:hover{
    background:white;
    color:black;
}

/* ========================= */
/* SMALL BUTTON */
/* ========================= */

.small-buttons{
    display:flex;
    gap:14px;

    margin-bottom:28px;
}

.small-btn{
    padding:12px 22px;

    border:2px solid white;
    border-radius:14px;

    color:white;
    text-decoration:none;

    font-size:16px;
    font-weight:bold;

    transition:0.3s;
}

.small-btn:hover{
    background:white;
    color:black;
}

/* ========================= */
/* MORE INFO */
/* ========================= */

.info-title{
    font-size:18px;

    opacity:0.7;

    margin-bottom:18px;
}

/* ========================= */
/* GAME CARD */
/* ========================= */

.game-container{
    display:flex;
    gap:18px;

    flex-wrap:wrap;
}

.game-card{
    width:180px;
    height:170px;

    border:2px solid rgba(255,255,255,0.15);

    border-radius:22px;

    padding:18px;

    text-decoration:none;

    color:white;

    background:rgba(255,255,255,0.03);

    transition:0.3s;
}

.game-card:hover{
    transform:translateY(-6px);

    border-color:white;

    box-shadow:
    0 0 20px rgba(255,255,255,0.12);
}

/* icon */
.game-icon{
    font-size:42px;

    margin-bottom:12px;
}

/* text */
.game-card h2{
    font-size:24px;

    margin-bottom:8px;
}

.game-card p{
    font-size:15px;

    opacity:0.7;
}

/* ========================= */
/* RESPONSIVE */
/* ========================= */

@media(max-width:768px){

    .popup-content{
        width:92%;
        height:80%;
    }

    .game-container{
        justify-content:center;
    }

    .game-card{
        width:100%;
    }
}

    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">AgreeWeb</div>
        <div class="menu">
            <a href="market.html">Market</a>
            <a href="tentang.html">Tentang</a>
            <a href="kontak.html">Kontak</a>
        </div>
    </div>

    <!-- HERO -->
    <div class="hero">
        <h1>Selamat Datang</h1>
        <p>Website untuk pembelajaran sederhana tentang dunia coding</p>
        <button class="btn">Mulai</button>
    </div>
<!-- POPUP -->

<button class="open-popup-btn" onclick="openPopup()">
    Open Popup
</button>
<div id="popup" class="popup">

    <div class="popup-content">

        <!-- tombol close -->
        <button class="close-btn" onclick="closePopup()">×</button>

        <!-- title -->
        <h1>Popup Page</h1>

        <!-- tombol utama -->
        <a href="branded.html" class="main-btn">
            Brand
        </a>

        <!-- tombol kecil -->
        <div class="small-buttons">

            <a href="kontak.html" class="small-btn">
                Kontak
            </a>

            <a href="tentang.html" class="small-btn">
                Tentang
            </a>

        </div>

        <!-- more info -->
        <p class="info-title">More Information</p>

        <!-- cards -->
        <div class="game-container">

            <!-- GAME 1 -->
            <a href="game.html" class="game-card">

                <div class="game-icon">🎮</div>

                <h2>Game 1</h2>

                <p>Play now →</p>

            </a>

            <!-- GAME 2 -->
            <a href="game1.html" class="game-card">

                <div class="game-icon">🎮</div>

                <h2>Game 2</h2>

                <p>Play now →</p>

            </a>

            <!-- GAME 3 -->
            <a href="game3.html" class="game-card">

                <div class="game-icon">🎮</div>

                <h2>Game 3</h2>

                <p>Play now →</p>

            </a>

        </div>

    </div>

</div>

    <!-- SECTION -->
    <div class="section">
        <h2>Fitur</h2>
        <div class="cards">
            <div class="card">⚡ Cepat</div>
            <div class="card">🎨 Elegan</div>
            <div class="card">🔒 Aman</div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        © 2026 Website - Powered by Nginx
    </footer>

<script>
function closePopup(){
    document.getElementById("popup").style.display = "none";
}
</script>

<script>
function openPopup(){
    document.getElementById("popup").style.display = "flex";
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
