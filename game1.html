<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON RUNNER X - Premium Arcade</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#020208;
    touch-action:none;
}

canvas{
    display:block;
    position:fixed;
    inset:0;
    z-index:1;
}

/* SCORE UI */
#ui{
    position:fixed;
    top:20px;
    left:20px;
    z-index:50;
}

#scoreBox{
    background:rgba(10, 10, 25, 0.6);
    border:2px solid #00ffff;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    padding:10px 25px;
    border-radius:16px;
    min-width:140px;
    box-shadow: 0 0 20px rgba(0,255,255,0.3);
    text-align: center;
}

#scoreTitle{
    font-size:11px;
    letter-spacing:4px;
    font-weight: bold;
    opacity:0.8;
    margin-bottom:2px;
    color:#94a3b8;
}

#score{
    font-size:36px;
    font-weight:900;
    color:#00ffff;
    text-shadow: 0 0 10px #00ffff;
}

/* HOME BUTTON */
#homeBtn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:50;
    padding:12px 20px;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:14px;
    background:rgba(255,255,255,0.05);
    color:white;
    font-weight: 600;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    cursor:pointer;
    transition: 0.3s;
}

#homeBtn:hover{
    background:rgba(255,255,255,0.2);
    box-shadow: 0 0 15px rgba(255,255,255,0.2);
}

/* MENUS & SCREENS BASE */
.screen-overlay {
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:100;
    background:radial-gradient(circle at center, rgba(10,10,30,0.85) 0%, rgba(2,2,8,0.98) 100%);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    color:white;
    text-align:center;
    padding:20px;
    transition: opacity 0.4s ease;
}

.panel-card {
    width:360px;
    max-width:90%;
    background:rgba(15, 15, 35, 0.75);
    border:2px solid #ff00ff;
    border-radius:24px;
    padding:40px 30px;
    box-shadow: 0 0 40px rgba(255,0,255,0.25);
    animation: panelAppear 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes panelAppear {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

h1.neon-title {
    font-size:46px;
    font-weight: 900;
    margin-bottom:20px;
    letter-spacing: 2px;
    background:linear-gradient(90deg,#00ffff,#ff00ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    filter: drop-shadow(0 0 15px rgba(0,255,255,0.5));
}

.panel-card p {
    color: #94a3b8;
    margin-bottom:30px;
    line-height:1.6;
    font-size: 15px;
}

/* MODERN BUTTONS */
.btn-neon {
    width: 100%;
    padding:16px;
    border:none;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    letter-spacing: 1px;
    cursor:pointer;
    transition: all 0.3s ease;
    margin-top: 12px;
}

.btn-cyan-pink {
    background:linear-gradient(90deg,#00ffff,#ff00ff);
    color:white;
    box-shadow: 0 4px 20px rgba(255,0,255,0.3);
}

.btn-cyan-pink:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,255,255,0.5);
}

.btn-dark {
    background:rgba(255,255,255,0.05);
    color:#cbd5e1;
    border:1px solid rgba(255,255,255,0.15);
}

.btn-dark:hover {
    background:rgba(255,255,255,0.15);
    color: white;
}

/* MOBILE CONTROLS */
#mobileControls{
    position:fixed;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    gap:40px;
    z-index:55;
    width: 100%;
    justify-content: center;
    padding: 0 20px;
}

.controlBtn{
    width:90px;
    height:90px;
    border-radius:50%;
    border:2px solid rgba(0, 255, 255, 0.4);
    background:rgba(10, 25, 50, 0.4);
    color:#00ffff;
    font-size:36px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    box-shadow: 0 0 15px rgba(0,255,255,0.15);
    transition: 0.1s;
}

.controlBtn:active{
    transform:scale(0.88);
    background:rgba(0,255,255,0.3);
    border-color: #00ffff;
    box-shadow: 0 0 25px rgba(0,255,255,0.5);
}

@media(max-width:600px){
    h1.neon-title { font-size:36px; }
    .controlBtn { width:80px; height:80px; font-size:30px; }
    #mobileControls { bottom: 30px; gap: 50px; }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>

<div id="ui">
    <div id="scoreBox">
        <div id="scoreTitle">SCORE</div>
        <div id="score">0</div>
    </div>
</div>

<button id="homeBtn" onclick="window.location.href='home.html'">⬅ MENU</button>

<div id="mobileControls">
    <button class="controlBtn" id="leftBtn">◀</button>
    <button class="controlBtn" id="rightBtn">▶</button>
</div>

<div id="menu" class="screen-overlay">
    <div class="panel-card" style="border-color: #00ffff; box-shadow: 0 0 40px rgba(0,255,255,0.25);">
        <h1 class="neon-title">NEON RUNNER X</h1>
        <p>
            <strong>PC:</strong> Tombol <kbd>A</kbd> / <kbd>D</kbd> atau Panah Kiri/Kanan<br>
            <strong>HP:</strong> Tap panel kontrol di layar bawah<br><br>
            Hindari rintangan kubus neon. Semakin jauh, laju kecepatan jet akan semakin ekstrem! ⚡
        </p>
        <button id="playBtn" class="btn-neon btn-cyan-pink">MULAI BALAPAN</button>
    </div>
</div>

<div id="gameOverScreen" class="screen-overlay" style="display:none;">
    <div class="panel-card">
        <h1 class="neon-title" style="background:linear-gradient(90deg,#ff0055,#ff00ff);">GAME OVER</h1>
        <p id="finalScore" style="font-size: 24px; font-weight: bold; color: #fff;">SCORE: 0</p>
        <button id="againBtn" class="btn-neon btn-cyan-pink">MAIN LAGI</button>
        <button id="backHomeBtn" class="btn-neon btn-dark">KEMBALI KE HOME</button>
    </div>
</div>

<script>
// Kode JavaScript standar non-module agar bisa dijalankan secara offline/lokal langsung di browser
var playing = false;
var score = 0;
var speed = 0.52;
var obstacleTimer = null;
var obstacles = [];
var keys = {};
var moveLeft = false;
var moveRight = false;

var menuScreen = document.getElementById('menu');
var gameOverScreen = document.getElementById('gameOverScreen');
var mobileControls = document.getElementById('mobileControls');
var scoreDisplay = document.getElementById('score');
var finalScoreText = document.getElementById('finalScore');

function startGame() {
    if(gameOverScreen) gameOverScreen.style.display = 'none';
    if(menuScreen) menuScreen.style.display = 'none';
    
    // Reset rintangan
    obstacles.forEach(function(o) { scene.remove(o); });
    obstacles.length = 0;

    score = 0;
    speed = 0.52;
    player.position.set(0, 0.5, 0);
    player.rotation.set(0, 0, 0);
    camera.position.x = 0;
    
    if(scoreDisplay) scoreDisplay.innerText = score;
    playing = true;

    if(window.innerWidth < 768 && mobileControls){
        mobileControls.style.display = 'flex';
    }
    
    startObstacleSpawn();
}

function gameOver(){
    playing = false;
    if(obstacleTimer) clearInterval(obstacleTimer);
    
    if(mobileControls) mobileControls.style.display = 'none';
    if(finalScoreText) finalScoreText.innerText = 'TOTAL SCORE: ' + score;
    if(gameOverScreen) gameOverScreen.style.display = 'flex';
}

function startObstacleSpawn() {
    if (obstacleTimer) clearInterval(obstacleTimer);
    obstacleTimer = setInterval(function() {
        if(playing) createObstacle();
    }, 650);
}

// SETUP THREE.JS GRAPHICS
var scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020208, 0.015);

var isMobile = window.innerWidth < 768;
var camera = new THREE.PerspectiveCamera(
    isMobile ? 75 : 65,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

if(isMobile){
    camera.position.set(0, 4.5, 9);
} else {
    camera.position.set(0, 3.8, 7.5);
}
camera.rotation.x = -0.2;

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// LIGHTING
var ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

var cyanLight = new THREE.PointLight(0x00ffff, 3, 50);
cyanLight.position.set(0, 5, 2);
scene.add(cyanLight);

var pinkLight = new THREE.PointLight(0xff00ff, 3, 50);
pinkLight.position.set(0, 5, -10);
scene.add(pinkLight);

// ROAD
var roadGeo = new THREE.PlaneGeometry(16, 300);
var roadMat = new THREE.MeshStandardMaterial({ color: 0x050510, metalness: 0.8, roughness: 0.3 });
var road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.position.z = -100;
scene.add(road);

// GRID
var grid = new THREE.GridHelper(16, 40, 0x00ffff, 0x334155);
grid.position.y = 0.01;
scene.add(grid);

// PLAYER JET CRAFT
var player = new THREE.Group();
var bodyGeo = new THREE.ConeGeometry(0.6, 2.5, 4);
var bodyMat = new THREE.MeshStandardMaterial({ color: 0x0d1527, metalness: 0.9, roughness: 0.1, emissive: 0x00ffff, emissiveIntensity: 0.5 });
var body = new THREE.Mesh(bodyGeo, bodyMat);
body.rotation.x = Math.PI / 2;
player.add(body);

var wingGeo = new THREE.BoxGeometry(2.2, 0.1, 0.8);
var wingMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, emissive: 0xff00ff, emissiveIntensity: 0.8 });
var wings = new THREE.Mesh(wingGeo, wingMat);
wings.position.set(0, -0.1, 0.3);
player.add(wings);

var glassGeo = new THREE.SphereGeometry(0.25, 8, 8);
var glassMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
var glass = new THREE.Mesh(glassGeo, glassMat);
glass.position.set(0, 0.25, -0.2);
glass.scale.set(1, 1, 2);
player.add(glass);

var engineGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.4, 8);
var engineMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
var engine = new THREE.Mesh(engineGeo, engineMat);
engine.rotation.x = Math.PI / 2;
engine.position.set(0, 0, 1.3);
player.add(engine);

player.position.y = 0.5;
scene.add(player);

// OBSTACLES MECHANICS
function createObstacle(){
    var size = 1.2 + Math.random() * 1.6;
    var geo = new THREE.BoxGeometry(size, size, size);
    var color = Math.random() > 0.5 ? 0x00ffff : 0xff00ff;
    var mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 2.5, roughness: 0.2 });
    
    var obs = new THREE.Mesh(geo, mat);
    obs.position.x = (Math.random() - 0.5) * 11;
    obs.position.y = size / 2;
    obs.position.z = -150;
    
    scene.add(obs);
    obstacles.push(obs);
}

// KEYBOARD ENGINE
window.addEventListener('keydown', function(e) { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', function(e) { keys[e.key.toLowerCase()] = false; });

// MOBILE CONTROLLER TOUCH EVENT
function setupTouch(btnId, direction){
    var btn = document.getElementById(btnId);
    if(!btn) return;
    btn.addEventListener('touchstart', function(e) {
        e.preventDefault();
        if(direction === 'left') moveLeft = true;
        if(direction === 'right') moveRight = true;
    }, { passive:false });

    btn.addEventListener('touchend', function() {
        moveLeft = false;
        moveRight = false;
    });
}
setupTouch('leftBtn', 'left');
setupTouch('rightBtn', 'right');

// MAIN RENDER ANIMATION LOOP
function animate(){
    requestAnimationFrame(animate);

    if(playing){
        speed += 0.00015;

        if(keys['a'] || keys['arrowleft'] || moveLeft){
            player.position.x -= 0.22;
            player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0.35, 0.1);
            player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, 0.15, 0.1);
        }
        else if(keys['d'] || keys['arrowright'] || moveRight){
            player.position.x += 0.22;
            player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -0.35, 0.1);
            player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, -0.15, 0.1);
        }
        else{
            player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0, 0.1);
            player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, 0, 0.1);
        }

        player.position.x = Math.max(-5.8, Math.min(5.8, player.position.x));

        grid.position.z += speed;
        if(grid.position.z > 7.5) {
            grid.position.z = 0;
        }

        for (var i = obstacles.length - 1; i >= 0; i--) {
            var obs = obstacles[i];
            obs.position.z += speed + 0.2;
            obs.rotation.x += 0.015;
            obs.rotation.y += 0.02;

            if(obs.position.z > 12){
                scene.remove(obs);
                obstacles.splice(i, 1);
                score++;
                if(scoreDisplay) scoreDisplay.innerText = score;
                continue;
            }

            var dx = player.position.x - obs.position.x;
            var dz = player.position.z - obs.position.z;
            
            if(Math.abs(dx) < 1.6 && Math.abs(dz) < 1.8){
                gameOver();
            }
        }

        camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x * 0.75, 0.05);
        camera.rotation.y = -camera.position.x * 0.04;
    }

    renderer.render(scene, camera);
}

animate();

// ATTACHMENT MANUAL TOMBOL BUTTONS
document.getElementById('playBtn').onclick = startGame;
document.getElementById('againBtn').onclick = startGame;

// Mengubah arah tombol kembali ke index.html
document.getElementById('backHomeBtn').onclick = function() {
    window.location.href = 'index.html';
};

// WINDOW RESIZE
window.addEventListener('resize', function() {
    var mobile = window.innerWidth < 768;
    camera.fov = mobile ? 75 : 65;
    
    if(mobile){
        camera.position.set(0, 4.5, 9);
    } else {
        camera.position.set(0, 3.8, 7.5);
    }
    
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
