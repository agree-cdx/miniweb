<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tentang Saya</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#07142b;
    color:white;
    padding:25px;
}

.back-btn{
    background:#2d8cff;
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    margin-bottom:25px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:#15233f;
    padding:35px;
    border-radius:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.profile{
    text-align:center;
    margin-bottom:30px;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#2d8cff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    margin:auto;
    margin-bottom:15px;
}

.nama{
    font-size:32px;
    font-weight:bold;
}

.job{
    margin-top:8px;
    color:#9fb7e8;
    font-size:18px;
}

.info{
    margin-top:25px;
}

.item{
    background:#1c2c4f;
    padding:18px;
    border-radius:15px;
    margin-bottom:15px;
    font-size:18px;
}

.label{
    color:#7fb3ff;
    font-weight:bold;
    display:block;
    margin-bottom:6px;
}

.footer{
    margin-top:25px;
    text-align:center;
    color:#9fb7e8;
}
</style>
</head>
<body>

<button onclick="history.back()" class="back-btn">← Kembali</button>

<div class="container">
    <div class="card">

        <div class="profile">
            <div class="avatar">👤</div>
            <div class="nama">Agree SSK</div>
            <div class="job">Pelajar / Developer</div>
        </div>

        <div class="info">
            <div class="item">
                <span class="label">Nama Lengkap</span>
                Agree
            </div>

            <div class="item">
                <span class="label">Umur</span>
                Secret
            </div>

            <div class="item">
                <span class="label">Sekolah</span>
                Belum Lulus
            </div>

            <div class="item">
                <span class="label">Hobi</span>
                Networking, Gaming, Sibuk
            </div>

            <div class="item">
                <span class="label">Cita-cita</span>
                Menjadi Orang Sukses
            </div>

            <div class="item">
                <span class="label">Tentang Saya</span>
                Saya suka belajar teknologi, server, Linux, web development, dan hal-hal baru di dunia IT.
            </div>
        </div>

        <div class="footer">
            © 2026 My Profile
        </div>

    </div>
</div>

</body>
</html>
